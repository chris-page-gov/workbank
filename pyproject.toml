[project]
name = "workbank"
version = "0.1.0"
description = "BDUK Task Browser and WORKBank applications"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "jupyter",
    "notebook",
    "ipykernel",
    "datasets",
    "streamlit",
    # Additional dependencies for Jupyter notebooks
    "scipy", # Used for statistical functions (spearmanr, jensenshannon)
    "plotly", # Used for interactive plotting
    "statsmodels", # Used for statistical modeling and regression
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy",
]

[project.scripts]
browse-tasks = "bduk_app.browse_tasks:main"
gui-tasks = "bduk_app.gui_tasks:main"
